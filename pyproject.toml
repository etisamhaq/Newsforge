[project]
name = "newsforge"
version = "0.1.0"
description = "Newsforge: enterprise news crawling, extraction, deduplication and search platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "httpx>=0.27",
    "selectolax>=1.0",
    "trafilatura>=1.8",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "langdetect>=1.0.9",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
browser = ["playwright>=1.42"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]
