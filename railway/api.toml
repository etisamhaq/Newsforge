# Railway config for the API service (Settings > Config-as-code > railway/api.toml).
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
watchPatterns = ["app/**", "alembic/**", "docker/**", "pyproject.toml", "alembic.ini", "railway/api.toml"]

[deploy]
# Apply database migrations before the new version takes traffic.
preDeployCommand = ["alembic upgrade head"]
startCommand = "uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.multiRegionConfig."asia-southeast1-eqsg3a"]
numReplicas = 1
